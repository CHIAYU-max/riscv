name: ci

on:
  push:
  pull_request:

jobs:
  sim:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install tools
        run: sudo apt-get update && sudo apt-get install -y iverilog gcc-riscv64-unknown-elf
      - name: Testbench self-test
        run: make selftest
      - name: riscv-tests (rv32ui)
        # Runs once the core exists (rtl/rv32i_core.v)
        run: |
          if [ -f rtl/rv32i_core.v ]; then make test; else echo "rtl/rv32i_core.v not found, skipping"; fi
